services:
  backend:
    build: ./backend
    container_name: garderie-backend
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"
    networks:
      - garderie-net

  frontend:
    build: ./frontend
    container_name: garderie-frontend
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge
