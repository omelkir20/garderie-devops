services:
  backend:
    image: omelkir/garderie-backend:latest
    container_name: garderie-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"
    networks:
      - garderie-net

  frontend:
    image: omelkir/garderie-frontend:latest
    container_name: garderie-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge
